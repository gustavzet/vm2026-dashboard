<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Cup 2026 Dashboard</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&family=Noto+Color+Emoji&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════
       HEADER
  ═══════════════════════════════════════════════════════════════ -->
  <div class="header">
    <div class="header-left">
      <span style="font-size:28px">🏆</span>
      <div>
        <h1>WM 2026 <span>/ Dashboard</span></h1>
      </div>
    </div>
    <div class="header-right">
      <a href="https://buymeacoffee.com/takustik"
         target="_blank"
         style="display:inline-flex;align-items:center;gap:5px;background:#FFDD00;color:#000;font-weight:600;font-size:0.7rem;padding:5px 10px;border-radius:20px;text-decoration:none;white-space:nowrap;">
        ☕ Buy me a coffee
      </a>
	  <span class="live-badge">LIVE</span>
      <div class="clock-wrap">
        <div class="clock" id="clock">00:00:00</div>
        <div class="tournament-dates">11.06 – 19.07.2026</div>
      </div>
      <button class="settings-btn" onclick="toggleSettings()" title="Settings">⚙️</button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       EINSTELLUNGEN
  ═══════════════════════════════════════════════════════════════ -->
  <div class="settings-panel" id="settings-panel">
    <div class="settings-title">⚙ Settings</div>
    <div class="settings-row">

      <div class="settings-field">
        <label>🌍 My Country / Favourite</label>
        <select class="settings-select" id="sel-country">
          <!-- Europa -->
          <optgroup label="Europe">
            <option value="DE">🇩🇪 Germany</option>
            <option value="AT">🇦🇹 Austria</option>
            <option value="CH">🇨🇭 Switzerland</option>
            <option value="FR">🇫🇷 France</option>
            <option value="ES">🇪🇸 Spain</option>
            <option value="GB">🏴󠁧󠁢󠁥󠁮󠁧󠁿 England</option>
            <option value="NL">🇳🇱 Netherlands</option>
            <option value="PT">🇵🇹 Portugal</option>
            <option value="BE">🇧🇪 Belgium</option>
            <option value="HR">🇭🇷 Croatia</option>
            <option value="RS">🇷🇸 Serbia</option>
            <option value="RO">🇷🇴 Romania</option>
            <option value="UA">🇺🇦 Ukraine</option>
            <option value="SK">🇸🇰 Slovakia</option>
            <option value="SI">🇸🇮 Slovenia</option>
            <option value="AL">🇦🇱 Albania</option>
            <option value="GE">🇬🇪 Georgia</option>
            <option value="IT">🇮🇹 Italy</option>
            <option value="PL">🇵🇱 Poland</option>
            <option value="SE">🇸🇪 Sweden</option>
            <option value="TR">🇹🇷 Turkey</option>
          </optgroup>
          <!-- Americas -->
          <optgroup label="Americas">
            <option value="US">🇺🇸 USA</option>
            <option value="BR">🇧🇷 Brazil</option>
            <option value="AR">🇦🇷 Argentina</option>
            <option value="MX">🇲🇽 Mexico</option>
            <option value="CA">🇨🇦 Canada</option>
            <option value="CO">🇨🇴 Colombia</option>
            <option value="UY">🇺🇾 Uruguay</option>
            <option value="EC">🇪🇨 Ecuador</option>
            <option value="VE">🇻🇪 Venezuela</option>
            <option value="PE">🇵🇪 Peru</option>
            <option value="PY">🇵🇾 Paraguay</option>
            <option value="BO">🇧🇴 Bolivia</option>
            <option value="CW">🇨🇼 Curaçao</option>
            <option value="PA">🇵🇦 Panama</option>
            <option value="HN">🇭🇳 Honduras</option>
            <option value="CR">🇨🇷 Costa Rica</option>
            <option value="JM">🇯🇲 Jamaica</option>
          </optgroup>
          <!-- Africa -->
          <optgroup label="Africa">
            <option value="MA">🇲🇦 Morocco</option>
            <option value="SN">🇸🇳 Senegal</option>
            <option value="EG">🇪🇬 Egypt</option>
            <option value="NG">🇳🇬 Nigeria</option>
            <option value="CM">🇨🇲 Cameroon</option>
            <option value="CI">🇨🇮 Ivory Coast</option>
            <option value="ZA">🇿🇦 South Africa</option>
            <option value="TN">🇹🇳 Tunisia</option>
            <option value="GH">🇬🇭 Ghana</option>
            <option value="TZ">🇹🇿 Tanzania</option>
            <option value="AO">🇦🇴 Angola</option>
            <option value="BF">🇧🇫 Burkina Faso</option>
            <option value="CF">🇨🇫 Central Africa</option>
            <option value="MZ">🇲🇿 Mozambique</option>
          </optgroup>
          <!-- Asia & Oceania -->
          <optgroup label="Asia &amp; Oceania">
            <option value="JP">🇯🇵 Japan</option>
            <option value="KR">🇰🇷 South Korea</option>
            <option value="SA">🇸🇦 Saudi Arabia</option>
            <option value="IR">🇮🇷 Iran</option>
            <option value="AU">🇦🇺 Australia</option>
            <option value="NZ">🇳🇿 New Zealand</option>
            <option value="UZ">🇺🇿 Uzbekistan</option>
            <option value="QA">🇶🇦 Qatar</option>
            <option value="CN">🇨🇳 China</option>
            <option value="TH">🇹🇭 Thailand</option>
            <option value="IQ">🇮🇶 Iraq</option>
          </optgroup>
        </select>
      </div>

      <div class="settings-field">
        <label>🗣 Language</label>
        <select class="settings-select" id="sel-lang">
          <option value="de">🇩🇪 Deutsch</option>
          <option value="en">🇬🇧 English</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="es">🇪🇸 Español</option>
          <option value="nl">🇳🇱 Nederlands</option>
          <option value="pt">🇵🇹 Português</option>
          <option value="sv">🇸🇪 Svenska</option>
        </select>
      </div>

      <button class="settings-apply" onclick="applySettings()">
        Apply
      </button>

    </div>
    <div class="ha-hint-settings">
      💡 Home Assistant: <code>?country=GB&amp;lang=en</code> as URL parameter supported
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       TABS
  ═══════════════════════════════════════════════════════════════ -->
  <div class="tabs">
    <button class="tab active"
            id="tab-btn-spielplan"
            onclick="switchTab('spielplan', this)">
      🗓 <span data-i18n="schedule">Schedule</span>
    </button>
    <button class="tab"
            id="tab-btn-favorit"
            onclick="switchTab('favorit', this)">
      🏴󠁧󠁢󠁥󠁮󠁧󠁿 <span id="fav-tab-label">England</span>
    </button>
    <button class="tab"
            id="tab-btn-gruppen"
            onclick="switchTab('gruppen', this)">
      📊 <span data-i18n="groups">Groups</span>
    </button>
    <button class="tab"
            id="tab-btn-bracket"
            onclick="switchTab('bracket', this)">
      🏆 <span data-i18n="bracket">Bracket</span>
    </button>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       TAB: SPIELPLAN
  ═══════════════════════════════════════════════════════════════ -->
  <div id="tab-spielplan" class="view active">
    <div class="filter-bar">
      <button class="filter-btn active"
              onclick="setFilter('all', this)"
              data-i18n="filter_all">All</button>
      <button class="filter-btn"
              onclick="setFilter('heute', this)"
              data-i18n="filter_today">Today</button>
      <button class="filter-btn"
              onclick="setFilter('fav', this)"
              id="filter-fav-btn">🏴󠁧󠁢󠁥󠁮󠁧󠁿 England</button>
      <button class="filter-btn"
              onclick="setFilter('freietv', this)"
              id="filter-freetv-btn"
              data-i18n="filter_freetv">Free TV</button>
    </div>
    <div id="match-list-container">
      <!-- wird von app.js befüllt -->
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       TAB: FAVORIT
  ═══════════════════════════════════════════════════════════════ -->
  <div id="tab-favorit" class="view">

    <div class="next-match-hero" id="next-match-hero">
      <div class="next-label" data-i18n="next_match">⚡ Next Match</div>
      <div class="hero-teams" id="hero-teams">
        <!-- wird von app.js befüllt -->
      </div>
      <div class="hero-meta" id="hero-meta">
        <!-- wird von app.js befüllt -->
      </div>
    </div>

    <div class="countdown" id="countdown-box">
      <div>
        <div class="countdown-label" data-i18n="kickoff_in">Kick-off in</div>
      </div>
      <div class="countdown-time" id="countdown-display">––</div>
    </div>

    <div class="section-title" data-i18n="all_group_matches">
      All Group Matches
    </div>
    <div class="match-list" id="fav-match-list">
      <!-- populated by app.js -->
    </div>

    <div class="section-title" data-i18n="tv_rights">TV Rights</div>
    <div class="tv-rights-box" id="tv-rights-box">
      <!-- wird von app.js befüllt -->
    </div>

  </div>

  <!-- ═══════════════════════════════════════════════════════════
       TAB: GRUPPEN
  ═══════════════════════════════════════════════════════════════ -->
  <div id="tab-gruppen" class="view">
    <div id="groups-container">
      <!-- wird von app.js befüllt -->
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       TAB: BRACKET
  ═══════════════════════════════════════════════════════════════ -->
  <div id="tab-bracket" class="view">
    <div id="bracket-container">
      <!-- wird von app.js befüllt -->
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       FOOTER
  ═══════════════════════════════════════════════════════════════ -->
  <div class="ha-hint">
  💡 Home Assistant: Embed as a <code>webpage</code> card
  <br><br>
  <a href="https://buymeacoffee.com/takustik"
     target="_blank"
     style="display:inline-flex;align-items:center;gap:6px;background:#FFDD00;color:#000;font-weight:600;font-size:0.75rem;padding:6px 14px;border-radius:20px;text-decoration:none;margin-top:4px;">
    ☕ Buy me a coffee
  </a>
</div>

  <!-- ═══════════════════════════════════════════════════════════
       SCRIPTS — Reihenfolge wichtig!
  ═══════════════════════════════════════════════════════════════ -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
